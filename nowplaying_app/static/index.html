<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JPlaying Now</title>
    <style>
        body.dark { background: #0f111a; color: #fff; }
        body.light { background: #f3f4f6; color: #111827; }
        body.retro { background: #1c1917; color: #f59e0b; }
        html, body { height: 100%; height: 100dvh; }
        body { font-family: system-ui, sans-serif; margin: 0; overflow: hidden; transition: background 0.3s; }

        /* Stretches to the display, capped at 800x480 (480x800 in portrait) */
        #app {
            --pad: clamp(6px, 2vmin, 14px);
            width: min(100vw, 800px);
            height: min(100vh, 480px);
            height: min(100dvh, 480px); /* dvh = visible height, excludes mobile browser toolbars */
            margin: 0 auto;
            padding: var(--pad);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: var(--pad);
            font-size: clamp(12px, 3vmin, 18px);
        }
        @media (orientation: portrait) {
            #app { width: min(100vw, 480px); height: min(100vh, 800px); height: min(100dvh, 800px); }
        }

        header { display: flex; justify-content: space-between; align-items: center; flex: none; }
        .logo { color: inherit; display: block; }
        .logo svg { height: 2em; width: auto; display: block; }
        .settings-btn { background: #3b82f6; color: white; text-decoration: none; padding: 0.3em 0.8em; border-radius: 8px; font-weight: bold; font-size: 0.85em; }

        #container { flex: 1; min-height: 0; display: grid; gap: var(--pad); }
        /* Grid mode: cards side by side, auto-wrapping, rows share the height */
        #container.grid {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
            grid-auto-rows: minmax(0, 1fr);
        }
        /* Focus mode: cards stacked, each with the cover on the left */
        #container.focus { grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: var(--pad);
            min-width: 0; min-height: 0;
            display: flex; flex-direction: column;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }
        .card.active { border: 2px solid #10b981; }
        .focus .card { flex-direction: row; align-items: center; gap: var(--pad); text-align: left; }
        .info { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .grid .info { flex: none; }
        .focus .info { flex: 1; }

        /* Cover art is always square, sized to the largest square that fits */
        .cover { min-width: 0; min-height: 0; }
        .grid .cover { flex: 1 1 0; container-type: size; display: flex; align-items: center; justify-content: center; margin-top: 0.4em; }
        .grid .cover img { flex: none; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
        .focus .cover { flex: none; height: 100%; aspect-ratio: 1; }
        .cover img { display: block; border-radius: 12px; object-fit: cover; }
        .focus .cover img { width: 100%; height: 100%; }

        .badge { position: absolute; top: 8px; right: 8px; font-size: 0.7em; padding: 2px 8px; border-radius: 8px; background: #555; color: #fff; z-index: 1; }
        .badge.playing { background: #10b981; }
        .name { font-size: 0.8em; opacity: 0.6; }

        .title { font-size: 1.1em; font-weight: bold; margin: 0.4em 0 0.15em; }
        .artist { font-size: 0.9em; opacity: 0.7; margin: 0; }
        .title, .artist { overflow-wrap: anywhere; }
        /* Text is never cut off: JS shrinks .info font-size (--fit) until it fits */
        .info { font-size: calc(1em * var(--fit, 1)); }
    </style>
</head>
<body class="{{ config.theme }}">
    <div id="app">
        <header>
            <a href="/" class="logo" aria-label="JPlaying Now">
                <svg viewBox="0 0 270 44" role="img" xmlns="http://www.w3.org/2000/svg">
                    <!-- equalizer bars -->
                    <g fill="#10b981">
                        <rect x="2"  y="22" width="7" height="16" rx="3.5"/>
                        <rect x="13" y="8"  width="7" height="30" rx="3.5"/>
                        <rect x="24" y="15" width="7" height="23" rx="3.5"/>
                    </g>
                    <text x="44" y="35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
                          font-size="32" font-weight="800" letter-spacing="-0.5" fill="currentColor">JPlaying<tspan fill="#10b981" dx="9">Now</tspan></text>
                </svg>
            </a>
            <span>
                <a href="/history" class="settings-btn">History</a>
                <a href="/settings" class="settings-btn">⚙️ Settings</a>
            </span>
        </header>
        <div id="container" class="{{ config.display_mode }}"></div>
    </div>
    <script>
        const THEMES = ['dark', 'light', 'retro'];
        const MODES = ['grid', 'focus'];

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // Only allow local paths or http(s) URLs for images
        function safeUrl(url) {
            const u = String(url ?? '');
            return (u.startsWith('/') && !u.startsWith('//')) || /^https?:\/\//i.test(u) ? esc(u) : '/static/default_cover.png';
        }

        function card({ name, nameStyle, cls, style, badge, badgeCls, cover, title, artist, year, album, genre }) {
            return `
                <div class="card ${cls}" ${style ? `style="${style}"` : ''}>
                    <span class="badge ${badgeCls}">${esc(badge)}</span>
                    <div class="cover"><img src="${safeUrl(cover)}"></div>
                    <div class="info">
                        <div class="name" style="${nameStyle}">${esc(name)}</div>
                        <div class="title">${esc(title)}</div>
                        <div class="artist">${esc(artist)}</div>
                        ${album ? `<div class="artist">${esc(album)}</div>` : ''}
                        ${(genre || year) ? `<div class="artist">${esc([genre, year].filter(Boolean).join(' · '))}</div>` : ''}
                    </div>
                </div>`;
        }

        let lastHtml = null, lastClass = null;

        async function update() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                document.body.className = THEMES.includes(data.config.theme) ? data.config.theme : 'dark';
                const container = document.getElementById('container');
                container.className = MODES.includes(data.config.display_mode) ? data.config.display_mode : 'grid';

                let html = '';
                data.moodes.forEach(m => {
                    html += card({
                        name: m.name, nameStyle: '',
                        cls: m.playing ? 'active' : '', badge: m.playing ? 'Playing' : 'Paused',
                        badgeCls: m.playing ? 'playing' : '',
                        cover: m.coverart, title: m.title, artist: m.artist, year: m.year, album: m.album, genre: m.genre
                    });
                });

                if (data.config.mic_enabled) {
                    html += card({
                        name: data.ambient.name, nameStyle: 'color:#818cf8; opacity:1',
                        cls: 'active', style: 'border-color: #818cf8;', badge: 'Mic Active', badgeCls: 'playing',
                        cover: data.ambient.coverart, title: data.ambient.title, artist: data.ambient.artist,
                        year: data.ambient.year, album: data.ambient.album, genre: data.ambient.genre
                    });
                }
                // Only touch the DOM when something actually changed (avoids flashing)
                if (html !== lastHtml || container.className !== lastClass) {
                    container.innerHTML = html;
                    fitCards(container);
                    lastHtml = html;
                    lastClass = container.className;
                }
            } catch(e) { console.error(e); }
        }

        // Shrink text per card until everything fits and the cover keeps a sensible size
        function fitCards(container) {
            const focus = container.classList.contains('focus');
            container.querySelectorAll('.card').forEach(card => {
                const info = card.querySelector('.info');
                const img = card.querySelector('.cover');
                let fit = 1;
                const ok = () => {
                    if (card.scrollHeight > card.clientHeight + 1) return false;
                    if (info.scrollHeight > info.clientHeight + 1 && focus) return false;
                    // In grid mode keep the cover at least 35% of the card height
                    return focus || img.clientHeight >= card.clientHeight * 0.35;
                };
                while (!ok() && fit > 0.45) {
                    fit -= 0.05;
                    info.style.setProperty('--fit', fit.toFixed(2));
                }
            });
        }
        window.addEventListener('resize', () => fitCards(document.getElementById('container')));
        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
