<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f111a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JPlaying Now">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JPlaying Now</title>
    <style>
        /* Same family as JPlay: deep night, emerald accent, heavy system type, soft cards. */
        body.dark  { --bg: #0f111a; --card: rgba(255,255,255,0.06); --line: rgba(255,255,255,0.1); --text: #fff; --muted: #a3aabb; --track: rgba(255,255,255,0.14); --veil: rgba(15,17,26,0.72); }
        body.light { --bg: #f3f4f6; --card: #fff; --line: #e5e7eb; --text: #111827; --muted: #5b6474; --track: #d9dce3; --veil: rgba(243,244,246,0.8); }
        body.retro { --bg: #1c1917; --card: rgba(245,158,11,0.07); --line: rgba(245,158,11,0.18); --text: #fbbf24; --muted: #b08a4a; --track: rgba(245,158,11,0.2); --veil: rgba(28,25,23,0.78); }
        html, body { height: 100%; height: 100dvh; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0;
               overflow: hidden; transition: background 0.3s; -webkit-font-smoothing: antialiased; }

        /* Stretches to the display, capped at 800x480 (480x800 in portrait) */
        #app {
            --pad: clamp(8px, 2.4vmin, 16px);
            width: min(100vw, 800px); height: min(100vh, 480px); height: min(100dvh, 480px);
            margin: 0 auto; padding: var(--pad); box-sizing: border-box;
            display: flex; flex-direction: column; gap: var(--pad);
            font-size: clamp(12px, 3vmin, 18px); position: relative;
        }
        @media (orientation: portrait) { #app { width: min(100vw, 480px); height: min(100vh, 800px); height: min(100dvh, 800px); } }

        header { display: flex; align-items: center; gap: 0.5em; flex: none; position: relative; z-index: 3; }
        .logo { color: inherit; display: block; margin-right: auto; }
        .logo svg { height: 2em; width: auto; display: block; }
        .pill { display: inline-flex; align-items: center; gap: 0.4em; color: var(--muted); text-decoration: none; font: inherit; font-weight: 700;
                font-size: 0.85em; padding: 0.4em 0.85em; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
        .pill svg { width: 1.1em; height: 1.1em; }
        .pill.player { color: var(--text); max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
        .pill.player .dot { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--src, #6b7280); flex: none; }
        .menu { position: absolute; top: 2.6em; right: 0; min-width: 14em; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
                padding: 0.4em; box-shadow: 0 16px 40px rgba(0,0,0,0.45); display: none; }
        .menu.open { display: block; }
        .menu a, .menu button { display: flex; align-items: center; gap: 0.6em; width: 100%; box-sizing: border-box; padding: 0.7em 0.8em; border: 0; background: none;
                font: inherit; font-weight: 700; color: var(--text); text-decoration: none; border-radius: 10px; cursor: pointer; text-align: left; }
        .menu a:active, .menu button:active { background: var(--card); }
        .menu svg { width: 1.2em; height: 1.2em; flex: none; }
        .menu .label { font-size: 0.75em; color: var(--muted); padding: 0.6em 0.8em 0.2em; font-weight: 700; }
        .menu button.on::after { content: "✓"; margin-left: auto; color: #10b981; }
        .menu hr { border: 0; border-top: 1px solid var(--line); margin: 0.3em 0; }

        /* Each source has its own colour */
        .src-radio { --src: #f472b6; } .src-plex { --src: #f5b83d; } .src-cd { --src: #38bdf8; }
        .src-spotify { --src: #1ed760; } .src-bluetooth { --src: #60a5fa; } .src-mic { --src: #818cf8; } .src-none { --src: #6b7280; }

        /* The one panel */
        #panel { flex: 1; min-height: 0; position: relative; border-radius: 20px; overflow: hidden; background: var(--card);
                 border: 2px solid color-mix(in srgb, var(--src) 70%, transparent); }
        #panel[data-href] { cursor: pointer; }
        /* The cover, blurred, behind everything */
        .backdrop { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(40px) saturate(1.3); opacity: 0.55; }
        .veil { position: absolute; inset: 0; background: linear-gradient(90deg, var(--veil) 0%, color-mix(in srgb, var(--veil) 85%, transparent) 100%); }
        /* The cover is a square as tall as the panel; the text takes the rest */
        .inner { position: relative; height: 100%; box-sizing: border-box; padding: calc(var(--pad) * 1.3);
                 display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 100%; gap: calc(var(--pad) * 1.6); align-items: center; }
        .art { position: relative; height: 100%; width: auto; aspect-ratio: 1 / 1; min-width: 0; }
        @media (orientation: portrait) {
            .inner { grid-template-columns: 100%; grid-template-rows: auto minmax(0, 1fr); align-items: start; }
            .art { height: auto; width: min(100%, 46dvh); justify-self: center; }
        }
        .art img.main { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; box-shadow: 0 18px 40px rgba(0,0,0,0.45); }
        /* No song on the radio: the station's logo is the picture, on a light tile so any logo reads */
        .art.logo-only img.main { object-fit: contain; background: #fff; padding: 10%; box-sizing: border-box; }
        .art.disc img.main { border-radius: 50%; }
        /* A song on the radio: the station's logo, small, on the corner of the cover */
        .art img.badge { position: absolute; right: -6%; bottom: 3%; width: 26%; height: 26%; object-fit: contain; background: #fff; padding: 3%;
                         box-sizing: border-box; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.5); }
        .art .glyph { width: 100%; height: 100%; border-radius: 16px; display: grid; place-items: center; color: var(--src);
                      background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--src) 30%, transparent), transparent 70%), var(--card); }
        .art .glyph svg { width: 45%; height: 45%; }
        .playing .art.disc img.main { animation: spin 8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .info { min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 0.25em; font-size: calc(1em * var(--fit, 1)); }
        .chips { display: flex; align-items: center; gap: 0.45em; flex-wrap: wrap; margin-bottom: 0.4em; }
        .chip { display: inline-flex; align-items: center; gap: 0.4em; font-size: 0.8em; font-weight: 800; padding: 0.3em 0.8em 0.3em 0.6em;
                border-radius: 999px; color: var(--src); background: color-mix(in srgb, var(--src) 18%, transparent); white-space: nowrap; }
        .chip svg { width: 1.2em; height: 1.2em; }
        .chip.plain { color: var(--muted); background: var(--card); border: 1px solid var(--line); }
        .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 0.8em; }
        .eq i { width: 3px; border-radius: 2px; background: currentColor; animation: eq 1s ease-in-out infinite; transform-origin: bottom; }
        .eq i:nth-child(1) { height: 55%; animation-duration: 1.1s; } .eq i:nth-child(2) { height: 100%; animation-duration: 0.9s; animation-delay: -0.4s; }
        .eq i:nth-child(3) { height: 75%; animation-duration: 1.3s; animation-delay: -0.2s; }
        @keyframes eq { 50% { transform: scaleY(0.4); } }

        .title { font-size: 2.1em; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; overflow-wrap: anywhere; }
        .artist { font-size: 1.35em; font-weight: 700; overflow-wrap: anywhere; }
        .sub { font-size: 1em; color: var(--muted); overflow-wrap: anywhere; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.35em; margin-top: 0.5em; }
        .tag { font-size: 0.78em; font-weight: 700; padding: 0.15em 0.65em; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
        .tag.hint { color: var(--src); border-color: color-mix(in srgb, var(--src) 50%, transparent); }
        .tag.pulse { animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.45; } }
        .progress { margin-top: 0.9em; }
        .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
        .bar span { display: block; height: 100%; background: var(--src); width: 0; }
        .times { display: flex; justify-content: space-between; font-size: 0.78em; color: var(--muted); margin-top: 0.3em; font-variant-numeric: tabular-nums; font-weight: 600; }
        .foot { font-size: 0.8em; color: var(--muted); margin-top: 0.6em; }
        /* Lyrics: under the title, the line being sung bright in the middle, the rest dimmed and fading out */
        .info.with-lyrics { justify-content: flex-start; }
        .with-lyrics .title { font-size: 1.5em; }
        .with-lyrics .artist { font-size: 1.1em; }
        .with-lyrics .sub, .with-lyrics .tags { display: none; }
        .with-lyrics .progress { margin-top: 0.5em; }
        .lyrics { position: relative; flex: 1 1 auto; min-height: 5.5em; overflow: hidden; margin-top: 0.5em;
                  -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 75%, transparent);
                  mask-image: linear-gradient(transparent, #000 20%, #000 75%, transparent); }
        .lyrics .track { position: absolute; left: 0; right: 0; top: 0; will-change: transform;
                         transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
        .lyrics p { margin: 0; padding: 0.2em 0; font-size: 1.2em; font-weight: 750; line-height: 1.25; overflow-wrap: anywhere;
                    color: var(--muted); opacity: 0.5; transform-origin: left center; transition: color 0.4s, opacity 0.4s, transform 0.4s; }
        .lyrics p:empty::before { content: "♪"; }
        .lyrics p.now { color: var(--text); opacity: 1; transform: scale(1.06); }
        .lyrics p.near { opacity: 0.8; }
        /* No times: the whole text, readable, drifting up slowly through the song */
        .lyrics.plain .track { transition: transform 1s linear; }
        .lyrics.plain p { color: var(--text); opacity: 0.85; font-size: 1.05em; font-weight: 650; }
        @media (prefers-reduced-motion: reduce) { .eq i, .tag.pulse, .playing .art.disc img.main { animation: none; } .lyrics .track { transition: none; } }
    </style>
</head>
<body class="{{ config.theme }}">
    <div id="app">
        <header>
            <a href="/" class="logo" aria-label="JPlaying Now">
                <svg viewBox="0 0 270 44" role="img" xmlns="http://www.w3.org/2000/svg">
                    <g fill="#10b981">
                        <rect x="2"  y="22" width="7" height="16" rx="3.5"/>
                        <rect x="13" y="8"  width="7" height="30" rx="3.5"/>
                        <rect x="24" y="15" width="7" height="23" rx="3.5"/>
                    </g>
                    <text x="44" y="35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
                          font-size="32" font-weight="800" letter-spacing="-0.5" fill="currentColor">JPlaying<tspan fill="#10b981" dx="9">Now</tspan></text>
                </svg>
            </a>
            <button class="pill player" id="menu-btn" aria-haspopup="true" aria-expanded="false" hidden>
                <span class="dot"></span><span id="menu-name">Player</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <a href="/history" class="pill">History</a>
            <a href="/settings" class="pill">Settings</a>
            <div class="menu" id="menu" role="menu"></div>
        </header>
        <div id="panel" class="src-none"></div>
    </div>
    <script>
        const THEMES = ['dark', 'light', 'retro'];

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        // Only allow local paths or http(s) URLs for images
        function safeUrl(url, fallback = '/static/default_cover.png') {
            const u = String(url ?? '');
            return (u.startsWith('/') && !u.startsWith('//')) || /^https?:\/\//i.test(u) ? esc(u) : fallback;
        }
        function fmt(s) {
            s = Math.max(0, Math.floor(s || 0));
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        const ICONS = {
            radio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>',
            plex: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h5.2l6.8 9-6.8 9H6l6.8-9z"/></svg>',
            cd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>',
            spotify: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5.5 9.2c4.3-1.4 9.1-1 13 1.1M6.4 12.6c3.6-1.1 7.5-.7 10.6 1M7.3 15.8c2.8-.8 5.7-.5 8.1.8"/></svg>',
            bluetooth: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>',
            mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
            none: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>',
            open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
        };
        const EQ = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
        const tag = (t, cls = '') => `<span class="tag ${cls}">${esc(t)}</span>`;

        /* ---------- what the panel shows ---------- */

        // The chosen player, laid out for its source.
        function playerView(p, radioListen) {
            const v = { src: p.source || 'none', href: '/player/' + encodeURIComponent(p.id), live: p.playing,
                        chips: [], tags: [], cover: p.coverart, badge: '', artClass: '', progress: !!p.duration };
            const chip = (label) => `<span class="chip">${ICONS[p.source] || ICONS.none}${esc(label)}${p.playing ? EQ : ''}</span>`;
            const room = `<span class="chip plain">${esc(p.name)}</span>`;
            if (p.state === 'paused') v.tags.push(tag('Paused', 'hint'));

            if (p.source === 'radio') {
                v.chips.push(chip('Radio'), room);
                if (p.song_known) {
                    // A song: its cover, with the station's logo small on the corner
                    Object.assign(v, { title: p.title, artist: p.artist, sub: [p.album, p.year].filter(Boolean).join(' · ') });
                    v.badge = p.station_logo && p.station_logo !== p.coverart ? p.station_logo : '';
                    v.tags.unshift(tag(p.station));
                    if (p.recognised) v.tags.unshift(tag('Recognised from the stream', 'hint'));
                    if (p.genre) v.tags.push(tag(p.genre));
                } else {
                    // No song named: the station itself, its logo as the picture
                    Object.assign(v, { title: p.station || p.title, artist: '', sub: p.artist && p.artist !== 'Live radio' ? p.artist : 'Live radio' });
                    v.cover = p.station_logo || '';
                    v.artClass = v.cover ? 'logo-only' : 'glyph';
                    if (radioListen && p.playing) v.tags.push(tag('Listening for the song…', 'hint pulse'));
                }
                v.progress = false;  // a stream has no length
            } else if (p.source === 'cd') {
                v.chips.push(chip('CD'), room);
                Object.assign(v, { title: p.title, artist: p.artist, sub: [p.album, p.year].filter(Boolean).join(' · ') });
                if (p.detail) v.tags.push(tag(p.detail, 'hint'));
                if (p.quality) v.tags.push(tag(p.quality));
                if (!/^https?:/i.test(p.coverart || '')) { v.cover = '/static/idle.png?v=2'; v.artClass = 'disc'; }
            } else if (p.source === 'plex') {
                v.chips.push(chip('Plex'), room);
                Object.assign(v, { title: p.title, artist: p.artist, sub: [p.album, p.year].filter(Boolean).join(' · ') });
                if (p.quality) v.tags.push(tag(p.quality, 'hint'));
                if (p.genre) v.tags.push(tag(p.genre));
            } else if (p.source === 'spotify') {
                v.chips.push(chip('Spotify'), room);
                Object.assign(v, { title: p.title, artist: p.artist, sub: [p.album, p.year].filter(Boolean).join(' · ') });
                v.tags.push(tag('Spotify Connect', 'hint'));
            } else if (p.source === 'bluetooth') {
                v.chips.push(chip('Bluetooth'), room);
                Object.assign(v, { title: p.title || 'Bluetooth', artist: p.artist, sub: [p.album, p.year].filter(Boolean).join(' · ') });
                if (p.detail) v.tags.push(tag(`From ${p.detail}`, 'hint'));
                if (!/^https?:/i.test(p.coverart || '')) v.artClass = 'glyph';
            }
            if (p.detail === 'DAC is off') v.tags.push(tag('DAC is off', 'hint'));
            return v;
        }

        // The player is idle (or there is none): what the microphone hears in this room.
        function listenerView(a, p) {
            const idle = !p ? '' : !p.online ? `${p.name} is offline` : p.state === 'paused' ? `${p.name} is paused` : `${p.name} is idle`;
            return {
                src: 'mic', live: !!a.identified, href: '', chips: [`<span class="chip">${ICONS.mic}Heard in this room${a.identified ? EQ : ''}</span>`],
                title: a.title, artist: a.artist, sub: [a.album, a.year].filter(Boolean).join(' · '),
                tags: a.identified && a.genre ? [tag(a.genre)] : [], cover: a.coverart, badge: '', artClass: '', progress: false,
                foot: idle ? `${idle} · open it from the menu above` : '',
            };
        }

        function render(v) {
            const art = v.artClass === 'glyph'
                ? `<div class="art"><div class="glyph">${ICONS[v.src] || ICONS.none}</div></div>`
                : `<div class="art ${v.artClass}"><img class="main" src="${safeUrl(v.cover)}" alt="">${v.badge ? `<img class="badge" src="${safeUrl(v.badge)}" alt="" onerror="this.remove()">` : ''}</div>`;
            const bg = v.artClass === 'glyph' || v.artClass === 'logo-only' ? '' : safeUrl(v.cover, '');
            return `
                ${bg ? `<div class="backdrop" style="background-image:url('${bg}')"></div>` : ''}
                <div class="veil"></div>
                <div class="inner ${v.live ? 'playing' : ''}">
                    ${art}
                    <div class="info ${v.lyrics ? 'with-lyrics' : ''}">
                        <div class="chips">${v.chips.join('')}</div>
                        <div class="title">${esc(v.title)}</div>
                        ${v.artist ? `<div class="artist">${esc(v.artist)}</div>` : ''}
                        ${v.sub ? `<div class="sub">${esc(v.sub)}</div>` : ''}
                        ${v.tags.length ? `<div class="tags">${v.tags.join('')}</div>` : ''}
                        ${v.lyrics ? lyricsHtml(v.lyrics) : ''}
                        ${v.progress ? '<div class="progress"><div class="bar"><span></span></div><div class="times"><span class="pos"></span><span class="dur"></span></div></div>' : ''}
                        ${v.foot ? `<div class="foot">${esc(v.foot)}</div>` : ''}
                    </div>
                </div>`;
        }

        /* ---------- lyrics ---------- */

        // The song on screen (data.lyrics from the server) and its lyrics once fetched.
        // pos0/at: where in the song we were at `at` (performance.now()); null when unknown (then: scroll slowly).
        let lyr = { key: null, data: null, pos0: null, at: 0, running: false, seenAt: 0, dur: 0 };

        function lyricsPos(now = performance.now()) {
            if (lyr.pos0 == null) return (now - lyr.seenAt) / 1000;   // unknown: since the song appeared
            return lyr.pos0 + (lyr.running ? (now - lyr.at) / 1000 : 0);
        }

        // Follow the song the server says is on screen: fetch its lyrics once, keep the clock in step.
        function syncLyrics(t) {
            if (!t) { lyr = { key: null, data: null, pos0: null, at: 0, running: false, seenAt: 0, dur: 0 }; return; }
            const now = performance.now();
            if (t.key !== lyr.key) {
                lyr = { key: t.key, data: null, pos0: null, at: now, running: t.playing, seenAt: now, dur: t.duration || 0 };
                const key = t.key;
                const q = new URLSearchParams({ artist: t.artist || '', title: t.title || '', album: t.album || '' });
                if (t.duration) q.set('duration', t.duration);
                fetch('/api/lyrics?' + q).then(r => r.json()).then(d => {
                    if (lyr.key !== key) return;            // the song changed meanwhile
                    lyr.data = d;
                    lastHtml = null;                         // redraw with the lyrics
                    update();
                }).catch(() => {});
            }
            lyr.dur = t.duration || lyr.dur;
            if (t.position != null) {
                // Small differences are just polling jitter; only jump when the song really moved (seek, new match).
                const off = lyr.pos0 == null ? Infinity : Math.abs(t.position - lyricsPos());
                if (off > 1.5 || lyr.running !== t.playing) { lyr.pos0 = t.position; lyr.at = performance.now(); }
            }
            lyr.running = t.playing;
        }

        // What render() gets: the lines, and whether they can follow the music
        function lyricsView() {
            const d = lyr.data;
            if (!d || !d.found) return null;
            const synced = d.synced && d.synced.length && lyr.pos0 != null;
            return synced ? { mode: 'synced', lines: d.synced } : { mode: 'plain', lines: (d.plain || []).map(l => [null, l]) };
        }

        function lyricsHtml(l) {
            return `<div class="lyrics ${l.mode}"><div class="track">${l.lines.map(([, line]) => `<p>${esc(line)}</p>`).join('')}</div></div>`;
        }

        // Four times a second: highlight the line being sung and glide it to the middle (or drift the text up).
        function lyricsTick() {
            const box = panel.querySelector('.lyrics'), track = box && box.querySelector('.track');
            if (!track) return;
            const pos = lyricsPos();
            const lines = track.children;
            if (box.classList.contains('synced')) {
                const times = lyr.data.synced;
                let i = -1;
                while (i + 1 < times.length && times[i + 1][0] <= pos + 0.3) i++;   // a touch early reads better
                const cur = track.querySelector('p.now');
                if (cur !== (lines[i] || null)) {
                    track.querySelectorAll('p.now, p.near').forEach(p => p.classList.remove('now', 'near'));
                    if (lines[i]) {
                        lines[i].classList.add('now');
                        lines[i - 1]?.classList.add('near');
                        lines[i + 1]?.classList.add('near');
                    }
                }
                const focus = lines[Math.max(i, 0)];
                if (focus) {
                    const y = box.clientHeight * 0.42 - (focus.offsetTop + focus.offsetHeight / 2);
                    track.style.transform = `translateY(${Math.round(y)}px)`;
                }
            } else {
                // Start after a short intro, reach the end a little before the song does
                const dur = lyr.dur || 210;
                const frac = Math.min(1, Math.max(0, (pos - dur * 0.08) / (dur * 0.82)));
                const room = Math.max(0, track.scrollHeight - box.clientHeight * 0.6);
                track.style.transform = `translateY(${Math.round(box.clientHeight * 0.2 - frac * room)}px)`;
            }
        }

        /* ---------- updating ---------- */

        let lastHtml = null, data = null, clock = { pos: 0, dur: 0, at: 0, running: false };
        const panel = document.getElementById('panel');

        async function update() {
            try {
                data = await (await fetch('/api/dashboard')).json();
                document.body.className = THEMES.includes(data.config.theme) ? data.config.theme : 'dark';
                const p = data.player;
                // Playing, or paused for a moment: the player. Stopped, idle, or paused for a while: the listener.
                const active = p && p.online && p.source && p.show;
                const v = active ? playerView(p, data.radio_listen) : listenerView(data.ambient, p);
                syncLyrics(data.lyrics);
                v.lyrics = data.lyrics ? lyricsView() : null;
                const html = render(v);
                if (html !== lastHtml) {
                    panel.className = `src-${v.src}`;
                    if (v.href) panel.dataset.href = v.href; else delete panel.dataset.href;
                    panel.innerHTML = html;
                    fit();
                    lastHtml = html;
                    lyricsTick();
                }
                if (data.screen) screenOff = !data.screen.on && Date.now() - wokeAt > 4000;
                clock = active && p.duration ? { pos: p.position || 0, dur: p.duration, at: performance.now(), running: p.playing } : { dur: 0 };
                tick();
                updateMenu();
            } catch (e) { console.error(e); }
        }

        // Elapsed time moves every second between updates
        function tick() {
            if (!clock.dur) return;
            const pos = Math.min(clock.dur, clock.pos + (clock.running ? (performance.now() - clock.at) / 1000 : 0));
            const bar = panel.querySelector('.bar span');
            if (bar) bar.style.width = `${(100 * pos / clock.dur).toFixed(2)}%`;
            const a = panel.querySelector('.pos'), b = panel.querySelector('.dur');
            if (a) a.textContent = fmt(pos);
            if (b) b.textContent = `-${fmt(clock.dur - pos)}`;
        }

        // Shrink the text until everything fits next to the cover
        function fit() {
            const info = panel.querySelector('.info');
            if (!info) return;
            let f = 1;
            info.style.setProperty('--fit', '1');
            while (info.scrollHeight > info.clientHeight + 1 && f > 0.45) {
                f -= 0.05;
                info.style.setProperty('--fit', f.toFixed(2));
            }
        }

        /* ---------- the player menu (next to History) ---------- */

        const menuBtn = document.getElementById('menu-btn'), menu = document.getElementById('menu');
        function updateMenu() {
            const p = data.player;
            menuBtn.hidden = !p;
            if (!p) return;
            document.getElementById('menu-name').textContent = p.name;
            menuBtn.className = `pill player src-${p.online ? (p.source || 'none') : 'none'}`;
            if (menu.classList.contains('open')) return;   // don't rebuild while it's in use
            menu.innerHTML =
                `<a href="/player/${encodeURIComponent(p.id)}">${ICONS.open}Open ${esc(p.name)}</a>` +
                (data.players.length > 1
                    ? `<hr><div class="label">Show on this display</div>` +
                      data.players.map(x => `<button data-view="${esc(x.id)}" class="${x.id === data.view ? 'on' : ''}">${esc(x.name)}</button>`).join('')
                    : '');
        }
        menuBtn.addEventListener('click', e => {
            e.stopPropagation();
            const open = !menu.classList.contains('open');
            menu.classList.toggle('open', open);
            menuBtn.setAttribute('aria-expanded', String(open));
        });
        menu.addEventListener('click', async e => {
            const b = e.target.closest('button[data-view]');
            if (!b) return;
            await fetch('/api/view', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ player: b.dataset.view }) });
            menu.classList.remove('open');
            lastHtml = null;
            update();
        });
        document.addEventListener('click', e => { if (!e.target.closest('#menu')) menu.classList.remove('open'); });

        // On the Pi's own screen, the tap that wakes the screen only wakes it: it doesn't open the player or a menu.
        let screenOff = false, wokeAt = 0;
        const KIOSK = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
        const swallowWakingTap = e => {
            if (!KIOSK) return;
            if (screenOff) { screenOff = false; wokeAt = Date.now(); }
            if (Date.now() - wokeAt < 1200) { e.preventDefault(); e.stopPropagation(); }
        };
        for (const t of ['pointerdown', 'pointerup', 'click']) document.addEventListener(t, swallowWakingTap, true);

        // Tap the panel (while the player plays) to open the player's own page
        panel.addEventListener('click', () => { if (panel.dataset.href) location.href = panel.dataset.href; });
        window.addEventListener('resize', fit);
        setInterval(update, 2000);
        setInterval(tick, 1000);
        setInterval(lyricsTick, 250);
        update();
    </script>
</body>
</html>
