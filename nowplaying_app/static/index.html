<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Now Playing Monitor</title>
    <style>
        body.dark { background: #0f111a; color: #fff; }
        body.light { background: #f3f4f6; color: #111827; }
        body.retro { background: #1c1917; color: #f59e0b; }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; transition: all 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .settings-btn { background: #3b82f6; color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .focus { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
        .card.active { border: 2px solid #10b981; }
        img { width: 100%; height: 250px; border-radius: 12px; object-fit: cover; margin-top: 10px; }
        .badge { position: absolute; top: 12px; right: 12px; font-size: 0.7rem; padding: 3px 8px; border-radius: 8px; background: #555; color: #fff; }
        .badge.playing { background: #10b981; }
        
        /* Updated CSS for multiline wrapping */
        .title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            margin: 10px 0 4px; 
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .artist { 
            font-size: 0.9rem; 
            opacity: 0.7; 
            margin: 0; 
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="{{ config.theme }}">
    <header>
        <h1>Now Playing</h1>
        <a href="/settings" class="settings-btn">⚙️ Settings</a>
    </header>
    <div id="container" class="{{ config.display_mode }}"></div>
    <script>
        const THEMES = ['dark', 'light', 'retro'];
        const MODES = ['grid', 'focus'];

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // Only allow local paths or http(s) URLs for images
        function safeUrl(url) {
            const u = String(url ?? '');
            return (u.startsWith('/') && !u.startsWith('//')) || /^https?:\/\//i.test(u) ? esc(u) : '/static/default_cover.png';
        }

        function card({ name, nameStyle, cls, style, badge, badgeCls, cover, title, artist, year }) {
            return `
                <div class="card ${cls}" ${style ? `style="${style}"` : ''}>
                    <span class="badge ${badgeCls}">${esc(badge)}</span>
                    <div style="${nameStyle}">${esc(name)}</div>
                    <img src="${safeUrl(cover)}">
                    <div class="title">${esc(title)}</div>
                    <div class="artist">${esc(artist)}</div>
                    ${year ? `<div class="artist year">${esc(year)}</div>` : ''}
                </div>`;
        }

        async function update() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                document.body.className = THEMES.includes(data.config.theme) ? data.config.theme : 'dark';
                const container = document.getElementById('container');
                container.className = MODES.includes(data.config.display_mode) ? data.config.display_mode : 'grid';

                let html = '';
                data.moodes.forEach(m => {
                    html += card({
                        name: m.name, nameStyle: 'font-size: 0.8rem; opacity:0.6',
                        cls: m.playing ? 'active' : '', badge: m.playing ? 'Playing' : 'Paused',
                        badgeCls: m.playing ? 'playing' : '',
                        cover: m.coverart, title: m.title, artist: m.artist, year: m.year
                    });
                });

                if (data.config.mic_enabled) {
                    html += card({
                        name: data.ambient.name, nameStyle: 'font-size: 0.8rem; color:#818cf8',
                        cls: 'active', style: 'border-color: #818cf8;', badge: 'Mic Active', badgeCls: 'playing',
                        cover: data.ambient.coverart, title: data.ambient.title, artist: data.ambient.artist,
                        year: data.ambient.year
                    });
                }
                container.innerHTML = html;
            } catch(e) { console.error(e); }
        }
        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
