# The safe updater's settings for this app (see deploy/install-updater.sh and deploy/update.sh)
# (read by bash: quote values with spaces)
NAME=jplayingnow
APP='JPlaying Now'
SERVICE=jplayingnow.service
# Where the app and the updater exchange update-request.json and update-status.json (relative to the repo)
STATE_DIR=nowplaying_app/data
HEALTH_URL=http://127.0.0.1:5000/api/version
# When one of these files changed, the Python packages are installed again (in the repo, as its owner)
DEPS_FILES=requirements.txt
DEPS_CMD='.venv/bin/pip install --quiet -r requirements.txt'
